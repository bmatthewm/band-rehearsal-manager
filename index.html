<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Band Rehearsal Manager</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20312c;background:#f3f5f3;--green:#176c56;--line:#dce4df}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:9px;padding:8px 11px;color:inherit}button:hover{background:#eaf3ee}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.danger{color:#ac3940}button:disabled{opacity:.4;cursor:default}input,select,textarea{border:1px solid #cbd8d0;border-radius:8px;padding:8px;background:white;color:#20312c;max-width:100%}input[type=checkbox]{accent-color:var(--green)}textarea{width:100%;min-height:70px}.wrap{max-width:1500px;margin:auto;padding:18px}.top{display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top h1{margin:0;font-size:23px}.sub{color:#6a7c71;font-size:12px}.tabs,.toolbar,.controls,.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{margin:18px 0}.tabs button.active,.chips button.active{background:var(--green);color:white}.card,.pane{background:white;border:1px solid var(--line);border-radius:15px;padding:15px}.pane{margin-bottom:15px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.music-card{cursor:pointer;padding:10px;transition:transform .12s}.music-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px #193d281c}.cover{height:112px;background:linear-gradient(145deg,#e0eee8,#f1eee2);border-radius:9px;display:flex;justify-content:center;align-items:center;overflow:hidden}.cover img{max-width:100%;max-height:100%;object-fit:contain}.cover .symbol{font-size:38px;color:#58826d}.music-card h3{font-size:14px;margin:9px 0 3px;line-height:1.3}.meter{background:#e6ece8;height:8px;border-radius:10px;overflow:hidden}.meter>span{display:block;height:100%;border-radius:10px}.meta{font-size:12px;color:#6a7c71}.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}.measure{border-bottom:1px solid var(--line);padding:9px 3px}.measure-head{display:flex;align-items:center;gap:10px}.measure-head strong{flex:1}.measure-body{padding:8px 4px 8px 27px}.note{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:14px}.note .note-text{flex:1;cursor:text;padding:3px;border-radius:5px}.note.done .note-text{text-decoration:line-through;color:#83928a}.note-text:focus{outline:1px solid var(--green);background:#f0f7f3}.minimal{border:0;background:none;padding:4px 6px}.tag{border-radius:6px;padding:4px 7px;font-size:11px;background:#edf3ef}.color-dot{height:10px;width:10px;border-radius:4px;display:inline-block;flex:none}.muted{color:#788980}.calendar-wrap{overflow-x:auto}.calendar{min-width:960px}.week{display:grid;grid-template-columns:65px repeat(5,minmax(0,1fr)) 65px;gap:4px;margin-bottom:4px}.weekday{text-align:center;padding:5px;font-weight:650;font-size:12px}.day{border:1px solid var(--line);border-radius:8px;background:white;min-height:124px;padding:6px;cursor:pointer;overflow:hidden}.day.off,.day.weekend{background:#e7ebe8;color:#84918a}.day.selected{outline:2px solid #188367;outline-offset:-2px}.day .date-num{font-size:12px;font-weight:bold}.event{display:block;color:white;font-size:11px;border-radius:4px;padding:4px;margin-top:4px;line-height:1.2;white-space:normal}.concert{background:#6554aa}.day .event:hover{filter:brightness(.93)}.builder-item{border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;gap:10px;background:white;margin:7px 0;align-items:flex-start}.builder-item.dragging{opacity:.4}.grab{color:#9baaa1;cursor:grab;font-size:21px;user-select:none}.builder-content{flex:1}.builder-content h4{margin:0 0 6px;font-size:14px}.builder-content ul{margin:5px 0;padding-left:20px;font-size:13px}.builder-content li{margin:4px 0}.export-preview{background:#fff;border:1px solid var(--line);padding:22px;border-radius:8px;white-space:normal}.export-preview h3{font-size:18px;margin:15px 0 4px}.export-preview ul{margin:5px 0 12px;padding-left:25px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.spread{justify-content:space-between}.row>input.grow{flex:1}.heading{margin:0 0 12px}.small{font-size:12px}.field{display:grid;gap:4px;margin-bottom:10px}.field label{font-size:12px;font-weight:600}.foot{font-size:12px;color:#6a7c71;text-align:center;margin:20px 0}.hidden{display:none!important}.stack{display:grid;gap:9px}.status{min-width:185px}.pill{font-size:11px;padding:3px 7px;background:#eef4f0;border-radius:10px}.lesson-row{border-bottom:1px solid var(--line);padding:9px 0}.cover-upload{max-width:130px;max-height:100px}.alert{background:#fff6e1;padding:10px;border-radius:8px;color:#815c20}.archive{opacity:.7}@media(max-width:850px){.split{grid-template-columns:1fr}.wrap{padding:11px}.cards{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}.day{min-height:95px}.calendar{min-width:890px}.top h1{font-size:20px}}
.measure-symbol{border:2px solid #253d34;min-width:51px;min-height:39px;display:inline-flex;align-items:center;justify-content:center;padding:5px 9px;font-weight:850;font-size:19px;background:#fff;border-radius:3px;line-height:1}.measure-title{display:flex;align-items:center;gap:9px}.measure-body .note{font-size:17px;line-height:1.5;margin:7px 0}.measure-body{padding-left:60px}.builder-content ul{font-size:17px;line-height:1.5}.builder-content h4{font-size:18px}.builder-content{min-width:0}.status-pill{font-size:11px;font-weight:750;border-radius:5px;padding:5px 9px;background:#edf3ef;color:#355747}.status-pill[data-kind="Mastered"]{background:#d1f0de;color:#11613a}.status-pill[data-kind="Needs Reteaching"]{background:#fee0e0;color:#a52d35}.status-pill[data-kind="Repetition Needed"]{background:#fff0c8;color:#895500}.status-pill[data-kind="Read"]{background:#d8eafd;color:#215d8d}.status-pill[data-kind="Introduced"]{background:#e6e0ff;color:#5940a0}.status-pill[data-kind="Needs Teaching"]{background:#fde7d4;color:#91501e}.status-pill[data-kind="Not Read — Easy"],.status-pill[data-kind="Not Read — Medium"]{background:#eceff2;color:#485563}.status-pill[data-kind="Concepts Introduced"]{background:#dceef0;color:#226f78}.music-card .meter{height:11px!important;background:#dce6df;margin:4px 0 8px}.ensemble-chip{font-size:11px;font-weight:700;padding:4px 6px;border-radius:5px;background:#eef0f7}.color-options{display:flex;gap:8px;flex-wrap:wrap}.color-options label{border:2px solid transparent;padding:5px;border-radius:8px;cursor:pointer}.color-options label:has(input:checked){border-color:#1b6d56;background:#eaf5ef}.color-swatch{display:inline-block;width:26px;height:26px;border-radius:6px;vertical-align:middle;border:1px solid #0002}.day{position:relative}.day.concert-day{background:#f0eafd;border-color:#9b86cf}.day.altered-day{background:#e6f5fb;border-color:#79b5cf}.date-off-button{position:absolute;right:4px;top:3px;border:0;padding:1px 3px;font-size:14px;background:none}.date-off-button:hover{background:#fee3e3}.collection-event{background:#bb653d;color:white}.field-section{padding:10px 0;border-top:1px solid var(--line)}.section-label{font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:#6a7c71}.music-card .meta{min-height:15px}.repertoire-filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.builder-item{background:#fff}.settings-calendar-form{display:grid;grid-template-columns:1fr 1fr;gap:7px}.settings-calendar-form input,.settings-calendar-form select{min-width:0;width:100%}@media(max-width:600px){.measure-body{padding-left:23px}.measure-symbol{min-width:43px;font-size:16px}.settings-calendar-form{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script>
const KEY='band_rehearsal_manager_v1';const statuses=['Needs Teaching','Not Read — Easy','Not Read — Medium','Introduced','Read','Concepts Introduced','Repetition Needed','Needs Reteaching','Mastered'];const skillOptions=['Note Accuracy','Accidentals','Rhythm','Counting','Dynamics','Articulation','Balance / Blend','Tone','Intonation','Phrasing','Tempo','Cues','Percussion / Equipment','Divisi','Repeats','D.S. / D.C.','Coda','Other'];const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateStr=(d)=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const today=dateStr(new Date());const initial={pieces:[{id:'wrath',title:'Wrath of the Mechanical Monsters',composer:'Randall Standridge',ensemble:'78',color:'#467bbd',cover:'',score:'',recording:'',publisher:'',archived:false,prep:[true,true,false],marks:[['Opening','Repetition Needed',['Work on piano dynamic','Chains, air siren, flexatone and metallic objects','Accuracy mastered']],['Measure 5','Read',['Triple-check accidentals in measure 8','Work on slow dynamic build']],['Measure 18','Introduced',['Low brass/reeds: counting in m. 18 and m. 20']],['Measure 27','Repetition Needed',['Subito piano needs work','Reinforce dotted quarter-note reading','M. 30 crescendo','M. 33 divisi, accidentals and dynamics']],['Measure 37','Not Read — Easy',['Repeated material, not yet read']],['Measure 45','Needs Teaching',['Not yet learned']],['Measure 53','Needs Teaching',['Counting and cues in m. 57','D.S. al Coda — return to m. 27']],['Measure 61 · Coda','Needs Teaching',['Coda jump from m. 37','Counting, dynamic contrast and accidentals']]].map(([name,status,notes])=>({id:uid(),name,status,skills:[],notes:notes.map(text=>({id:uid(),text,done:false}))}))}],plans:{},concerts:[{id:uid(),date:'2026-12-16',name:'Symphonic Band Concert',ensemble:'78'}],offDays:{}};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch{db=structuredClone(initial)};let ui={view:'repertoire',ensemble:'78',piece:'wrath',date:today,month:today.slice(0,7),expanded:{},skillOpen:{},showArchive:false,drag:null,repertoireFilter:'all'};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));document.querySelector('#save-status')?.replaceChildren(document.createTextNode('✓ Autosaved on this browser'))}catch(e){alert('Browser storage is full or blocked. Export a backup immediately.')}};const rerender=()=>{document.getElementById('app').innerHTML=render();bind()};const update=()=>{save();rerender()};const getPiece=id=>db.pieces.find(p=>p.id===id);const planKey=(d=ui.date,e=ui.ensemble)=>d+'|'+e;const plan=()=>db.plans[planKey()]||[];const setPlan=arr=>{db.plans[planKey()]=arr;update()};const applicable=p=>p.ensemble===ui.ensemble||p.ensemble==='both';const addItem=(kind,piece,mark)=>{const list=plan();list.push({id:uid(),kind,piece,mark,notes:[]});setPlan(list)};db.alteredDays=db.alteredDays||{};db.collections=db.collections||[];const noSchool=d=>{const dow=new Date(d+'T12:00:00').getDay();return dow===0||dow===6||db.offDays[d]};const pieceInDay=(d,p,e)=> (db.plans[planKey(d,e)]||[]).some(x=>x.piece===p);
function render(){return `<div class="wrap"><div class="top"><div><h1>♫ Band Rehearsal Manager</h1><div class="sub">Repertoire • Rehearsal maps • Calendar • Canva plans</div></div><div><span id="save-status" class="sub">✓ Autosaved on this browser</span></div></div><nav class="tabs">${[['repertoire','My Repertoire'],['calendar','Calendar'],['map','Rehearsal Map'],['plan','Daily Plan'],['settings','Settings & Backup']].map(([k,l])=>`<button data-nav="${k}" class="${ui.view===k?'active':''}">${l}</button>`).join('')}</nav><div class="toolbar pane"><b>Ensemble:</b><button data-ensemble="6" class="${ui.ensemble==='6'?'primary':''}">6th Grade</button><button data-ensemble="78" class="${ui.ensemble==='78'?'primary':''}">7th/8th Grade</button><span class="sub">${ui.view==='map'||ui.view==='plan'?'Planning date:':''}</span>${ui.view==='map'||ui.view==='plan'?`<input type="date" id="global-date" value="${ui.date}">`:''}</div>${{repertoire:renderRepertoire,calendar:renderCalendar,map:renderMap,plan:renderPlan,settings:renderSettings}[ui.view]()}<div class="foot">Saved locally in this browser. Use Settings & Backup regularly; cross-device syncing requires a database.</div></div>`}
function cover(p){return p.cover?`<img src="${esc(p.cover)}" alt="Cover for ${esc(p.title)}">`:`<div class="symbol">♫</div>`}
function renderRepertoire(){const pieces=db.pieces.filter(p=>!p.archived&&(ui.repertoireFilter==='all'||p.ensemble===ui.repertoireFilter||p.ensemble==='both'));return `<div class="pane"><div class="row spread"><h2 class="heading">My Repertoire</h2><div class="row"><button data-action="new-piece" class="primary">+ Add Piece</button><button data-action="toggle-archive">${ui.showArchive?'Hide':'Show'} Archive</button></div></div><div class="repertoire-filter"><span class="section-label">Show Scores</span>${[['all','All Scores'],['6','6th Grade'],['78','7th/8th Grade']].map(([k,v])=>`<button data-repertoire-filter="${k}" class="${ui.repertoireFilter===k?'primary':''}">${v}</button>`).join('')}</div><div class="cards" style="margin-top:14px">${pieces.map(p=>`<div class="card music-card" data-open-piece="${p.id}"><div class="cover">${cover(p)}</div><h3>${esc(p.title)}</h3><div class="meta">${esc(p.composer||'Composer not added')}</div><div class="row spread"><span class="ensemble-chip">${p.ensemble==='both'?'Both bands':p.ensemble==='6'?'6th Grade':'7th/8th Grade'}</span><span class="color-dot" style="background:${esc(p.color)}"></span></div><div class="row spread small" style="margin-top:10px"><span>Music preparation</span><b>${Math.round(p.prep.filter(Boolean).length/3*100)}%</b></div><div class="meter"><span style="background:${esc(p.color)};width:${p.prep.filter(Boolean).length/3*100}%"></span></div><div class="row spread" style="margin-top:8px"><span class="meta">${p.marks.length} sections</span><span class="meta">Open →</span></div></div>`).join('')||'<p>No pieces found for this filter.</p>'}</div></div>${ui.showArchive?`<div class="pane"><h3>Repertoire Archive</h3><div class="cards">${db.pieces.filter(p=>p.archived).map(p=>`<button data-open-piece="${p.id}">${esc(p.title)}</button>`).join('')||'No archived pieces'}</div></div>`:''}`}
function markSymbol(name){if(/d\\.?s\\.?|dal segno/i.test(name))return '𝄋';if(/coda/i.test(name))return '𝄌';const m=name.match(/(?:measure|m\\.?)\\s*(\\d+)/i);return m?m[1]:name.toLowerCase().includes('opening')?'O':name.slice(0,2)}
function renderMap(){let p=getPiece(ui.piece)||db.pieces[0];if(!p)return '<div class="pane">Add a piece to begin.</div>';const current=plan();return `<div class="row spread"><div><h2 style="margin:0">${esc(p.title)}</h2><div class="sub">${esc(p.composer||'Composer not added')} · ${p.ensemble==='both'?'Both ensembles':p.ensemble==='6'?'6th Grade':'7th/8th Grade'}</div></div><div class="controls"><button data-action="edit-piece">Edit Piece</button><button data-nav="repertoire">← Repertoire</button></div></div><div class="toolbar pane" style="margin-top:12px"><button ${p.score?'':'disabled'} data-action="score-link">📄 Score PDF ↗</button><button ${p.recording?'':'disabled'} data-action="recording-link">♫ Recording ↗</button><button data-action="add-run">+ Run Through</button><span class="sub">Select measures for ${esc(ui.date)} · ${ui.ensemble==='6'?'6th':'7th/8th'} Grade</span></div><div class="pane"><div class="row spread"><h3 class="heading">Rehearsal Map</h3><button data-action="toggle-all">${p.marks.every(m=>ui.expanded[m.id])?'Collapse':'Expand'} All</button></div>${p.marks.map(m=>{const scheduled=current.some(i=>i.kind==='mark'&&i.piece===p.id&&i.mark===m.id);return `<section class="measure"><div class="measure-head"><input type="checkbox" title="Plan this measure for ${ui.date}" data-mark-plan="${m.id}" ${scheduled?'checked':''}><strong><button class="minimal measure-title" data-toggle-mark="${m.id}"><span class="measure-symbol">${markSymbol(m.name)}</span><span>${esc(m.name)}</span></button></strong><span class="status-pill" data-kind="${esc(m.status)}">${esc(m.status)}</span></div>${ui.expanded[m.id]?`<div class="measure-body"><div class="row" style="margin-bottom:8px"><select aria-label="Learning status for ${esc(m.name)}" data-status="${m.id}" class="status">${statuses.map(s=>`<option ${m.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select><button class="minimal danger" data-remove-mark="${m.id}">Remove mark</button></div>${m.notes.map(n=>`<div class="note ${n.done?'done':''}"><input type="checkbox" data-note-done="${m.id}|${n.id}" ${n.done?'checked':''}><span class="note-text" contenteditable="true" data-note-edit="${m.id}|${n.id}">${esc(n.text)}</span><button class="minimal danger" title="Delete note" data-delete-note="${m.id}|${n.id}">×</button></div>`).join('')}<form data-form="note" data-mark-id="${m.id}" class="row"><input class="grow" name="note" placeholder="• Add bullet note — press Enter" required><button>+ Note</button></form><div class="chips" style="margin-top:9px">${m.skills.map(s=>`<button class="tag" data-skill-remove="${m.id}|${esc(s)}">${esc(s)} ×</button>`).join('')}<button data-skill-toggle="${m.id}">+ Skill</button></div>${ui.skillOpen[m.id]?`<div class="chips" style="margin-top:8px">${skillOptions.map(s=>`<button class="${m.skills.includes(s)?'active':''}" data-skill="${m.id}|${esc(s)}">${esc(s)}</button>`).join('')}</div>`:''}</div>`:''}</section>`}).join('')}<form class="row" data-form="mark" style="margin-top:16px"><input class="grow" name="name" placeholder="New measure or rehearsal mark" required><button class="primary">+ Rehearsal Mark</button></form></div>`}
function renderCalendar(){const [yy,mm]=ui.month.split('-').map(Number);const first=new Date(yy,mm-1,1).getDay(),num=new Date(yy,mm,0).getDate(),rows=Math.ceil((first+num)/7);let cells='';for(let w=0;w<rows;w++){cells+='<div class="week">';for(let c=0;c<7;c++){const n=w*7+c-first+1;if(n<1||n>num){cells+='<div></div>';continue}const d=ui.month+'-'+String(n).padStart(2,'0'),events=db.concerts.filter(x=>x.date===d),collect=db.collections.filter(x=>x.date===d),labels=db.pieces.filter(p=>pieceInDay(d,p.id,'6')||pieceInDay(d,p.id,'78')),altered=db.alteredDays[d];cells+=`<div class="day ${c===0||c===6?'weekend':''} ${db.offDays[d]?'off':''} ${altered?'altered-day':''} ${events.length?'concert-day':''} ${ui.date===d?'selected':''}" data-day="${d}"><span class="date-num">${n}</span><button title="Toggle No School" aria-label="Toggle No School on ${d}" class="date-off-button" data-off-toggle="${d}" style="opacity:${db.offDays[d]?1:.45}">${db.offDays[d]?'🛑':'⊘'}</button>${db.offDays[d]?'<div class="sub">No school</div>':''}${altered?`<div class="event" style="background:#287f9a">${esc(altered)}</div>`:''}${events.map(e=>`<div class="event concert">♫ ${esc(e.name)} · ${e.ensemble==='6'?'6th':e.ensemble==='78'?'7/8':'Both'}</div>`).join('')}${collect.map(e=>`<div class="event collection-event">↩ Collect: ${esc(getPiece(e.piece)?.title||'Music')}</div>`).join('')}${labels.map(p=>`<div class="event" style="background:${esc(p.color)}">${esc(p.title)}</div>`).join('')}</div>`}cells+='</div>'}return `<div class="pane"><div class="row spread"><button data-month="-1">← Previous</button><h2 class="heading">${new Date(yy,mm-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><button data-month="1">Next →</button></div><div class="calendar-wrap"><div class="calendar"><div class="week">${['Sun','Monday','Tuesday','Wednesday','Thursday','Friday','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}</div>${cells}</div></div><div class="sub">Gray = No School/weekend · Blue = altered schedule · Purple = concerts · Brown = collect music · ⊘ = toggle No School</div></div><div class="pane"><div class="row spread"><h3>${new Date(ui.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h3><span class="sub">Select a day, or use Settings for school dates and concerts</span></div><div class="controls"><button class="primary" data-nav="plan">Build ${ui.ensemble==='6'?'6th':'7th/8th'} Grade Plan →</button><button data-ensemble="${ui.ensemble==='6'?'78':'6'}">Switch Ensemble</button></div><h4>Collection Dates</h4>${db.collections.filter(c=>c.date===ui.date).map(c=>`<div class="row lesson-row">↩ ${esc(getPiece(c.piece)?.title||'Music')} <button class="minimal danger" data-delete-collection="${c.id}">×</button></div>`).join('')||'<p class="sub">Nothing to collect today.</p>'}<h4>Concerts</h4>${db.concerts.filter(c=>c.date===ui.date).map(c=>`<div class="row lesson-row">♫ ${esc(c.name)} <button class="minimal danger" data-delete-concert="${c.id}">×</button></div>`).join('')||'<p class="sub">No concerts today.</p>'}<button data-nav="settings">Manage school schedule and concerts in Settings →</button></div>`}
function renderPlan(){const items=plan();const eligible=db.pieces.filter(p=>!p.archived&&applicable(p));return `<div class="row spread"><div><h2 style="margin:0">Daily Rehearsal Plan</h2><div class="sub">${new Date(ui.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})} · ${ui.ensemble==='6'?'6th':'7th/8th'} Grade</div></div><button data-nav="calendar">Calendar ↗</button></div><div class="split" style="margin-top:14px"><div class="pane"><div class="row spread"><h3 class="heading">Rehearsal Order</h3><span class="sub">Drag ≡ to reorder</span></div>${items.map((it,i)=>{const p=getPiece(it.piece),m=p?.marks.find(x=>x.id===it.mark);const title=it.kind==='announcement'?'Announcements & Reminders':p?.title||'Piece';const lines=it.kind==='announcement'?it.notes:it.kind==='run'?['Run Through']:it.kind==='recording'?['Recording: '+(it.url||p?.recording||'')]:it.kind==='mark'?m?.notes.filter(n=>!n.done).map(n=>n.text)||[]:[];return `<div class="builder-item" draggable="true" data-drag-item="${it.id}"><span class="grab" title="Drag to reorder">☰</span><div class="builder-content"><h4>${p?`<span class="color-dot" style="background:${p.color}"></span> `:''}${esc(title)} ${it.kind==='mark'?`<span class="status-pill">${esc(m?.name||'Measure')}</span>`:''}</h4>${lines.length?`<ul>${lines.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}${it.kind==='announcement'?`<form data-form="announcement" data-id="${it.id}" class="row"><input class="grow" name="note" placeholder="Add reminder (Enter)" required><button>+</button></form>`:''}</div><div class="stack"><button class="minimal" data-move="${it.id}|-1" ${i===0?'disabled':''}>↑</button><button class="minimal" data-move="${it.id}|1" ${i===items.length-1?'disabled':''}>↓</button><button class="minimal danger" data-remove-item="${it.id}">×</button></div></div>`}).join('')||'<p class="muted">Add pieces or announcements to start planning.</p>'}<div class="controls"><button data-action="add-announcement">+ Announcements</button></div></div><div class="pane"><h3 class="heading">Add Rehearsal Material</h3>${eligible.map(p=>`<details style="border-bottom:1px solid var(--line);padding:10px 0"><summary><span class="color-dot" style="background:${p.color}"></span> <b>${esc(p.title)}</b></summary><div class="stack" style="padding:10px"><button data-add-run="${p.id}">+ Run Through</button><button data-add-recording="${p.id}">+ Recording Link for Canva</button><button data-add-collection="${p.id}">+ Collect Music on ${esc(ui.date)}</button>${p.marks.map(m=>`<button data-add-plan-mark="${p.id}|${m.id}">+ ${esc(m.name)}</button>`).join('')}<button data-open-piece="${p.id}">View full rehearsal map ↗</button></div></details>`).join('')}<hr><h3>Canva Export</h3><div class="export-preview" id="copy-preview">${exportHTML(items)}</div><button class="primary" style="width:100%;margin-top:12px" data-action="copy-canva">Copy formatted plan</button><div class="sub" style="margin-top:8px">Copies styled HTML with bold headings and bullets, plus plain text fallback. Paste into Canva.</div></div></div>`}
function blocks(items){let out=[];for(const it of items){const p=getPiece(it.piece),m=p?.marks.find(x=>x.id===it.mark);const title=it.kind==='announcement'?'Announcements and Reminders':p?.title||'Piece';const notes=it.kind==='announcement'?it.notes:it.kind==='run'?['Run Through']:it.kind==='mark'?m?.notes.filter(n=>!n.done).map(n=>n.text)||[]:[];if(out.length&&out[out.length-1].title===title&&it.kind!=='announcement')out[out.length-1].notes.push(...notes);else out.push({title,notes:[...notes]})}return out}
function exportHTML(items){return blocks(items).map(b=>`<div><h3 style="font-weight:700;margin:12px 0 3px;font-size:18px">${esc(b.title)}</h3><ul style="margin:0 0 8px;padding-left:24px">${b.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`).join('')||'<span class="muted">Nothing planned yet.</span>'}
function renderSettings(){const p=getPiece(ui.piece);return `<div class="split"><div class="pane"><h3 class="heading">Piece Setup</h3><div class="field" style="background:#edf2f7;border-radius:10px;padding:10px"><label>CHOOSE A PIECE TO EDIT</label><select id="edit-select">${db.pieces.map(x=>`<option value="${x.id}" ${x.id===ui.piece?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div>${p?`<form data-form="edit-piece" class="stack"><div class="field" style="padding-top:12px"><label>PIECE TITLE</label><input name="title" value="${esc(p.title)}" required></div><div class="field"><label>Composer / Arranger</label><input name="composer" value="${esc(p.composer)}"></div><div class="field"><label>Ensemble</label><select name="ensemble"><option value="6" ${p.ensemble==='6'?'selected':''}>6th Grade</option><option value="78" ${p.ensemble==='78'?'selected':''}>7th/8th Grade</option><option value="both" ${p.ensemble==='both'?'selected':''}>Both</option></select></div><div class="field"><label>Piece Color</label><div class="color-options">${['#467bbd','#258d6b','#b98532','#9956ae','#c65d67','#287f94','#59697c','#a2592b'].map(c=>`<label title="${c}"><input type="radio" name="color" value="${c}" ${p.color===c?'checked':''}><span class="color-swatch" style="background:${c}"></span></label>`).join('')}</div></div><div class="field"><label>Score PDF URL</label><input type="url" name="score" value="${esc(p.score)}" placeholder="https://..."></div><div class="field"><label>Recording URL</label><input type="url" name="recording" value="${esc(p.recording)}" placeholder="https://..."></div><div class="field"><label>Cover Image URL</label><input type="url" name="cover" value="${esc(p.cover)}" placeholder="https://..."></div><div class="field"><label>Publisher Page</label><input type="url" name="publisher" value="${esc(p.publisher)}" placeholder="https://..."></div><button type="button" data-action="pepper-search">🔎 Look up this piece on J.W. Pepper ↗</button><div class="sub">Opens a publisher search. Confirm composer and links, then enter them above. Automatic scraping isn't supported by static GitHub Pages.</div><div class="field-section stack"><b>Music Preparation</b>${['Score Received','Parts Received','Copies Ready'].map((x,i)=>`<label><input type="checkbox" name="prep${i}" ${p.prep[i]?'checked':''}> ${x}</label>`).join('')}</div><label><input type="checkbox" name="archived" ${p.archived?'checked':''}> Move to Repertoire Archive</label><button class="primary">Save Piece Details</button></form><button class="danger" data-action="delete-piece" style="margin-top:12px">Delete Piece Permanently</button>`:''}</div><div class="pane"><h3 class="heading">School Schedule & Concerts</h3><div class="field-section"><b>No School / Altered Schedule</b><p class="sub">Add dates here to update the calendar automatically. You can also click ⊘ on a calendar date.</p><form data-form="school-date" class="stack"><div class="settings-calendar-form"><input aria-label="School schedule date" type="date" name="date" value="${esc(ui.date)}" required><select name="type"><option value="off">No School</option><option value="altered">Altered Schedule</option></select></div><input name="label" placeholder="Optional label: Half day, Conference Day"><button>+ Save School Date</button></form>${Object.keys(db.offDays).sort().map(d=>`<div class="row lesson-row"><span>🛑 ${esc(d)} · No School</span><button class="minimal danger" data-delete-school-date="${d}">×</button></div>`).join('')}${Object.entries(db.alteredDays).sort().map(([d,t])=>`<div class="row lesson-row"><span>◈ ${esc(d)} · ${esc(t)}</span><button class="minimal danger" data-delete-school-date="${d}">×</button></div>`).join('')}</div><div class="field-section"><b>Concert Dates</b><form data-form="concert" class="stack"><input type="date" name="date" value="${esc(ui.date)}" required><input name="name" placeholder="Concert name" required><select name="ensemble"><option value="6">6th Grade</option><option value="78" selected>7th/8th Grade</option><option value="both">Both Ensembles</option></select><button>+ Add Concert</button></form>${db.concerts.map(c=>`<div class="row lesson-row"><span>♫ ${esc(c.date)} · ${esc(c.name)} · ${c.ensemble==='6'?'6th':c.ensemble==='78'?'7th/8th':'Both'}</span><button class="minimal danger" data-delete-concert="${c.id}">×</button></div>`).join('')}</div><div class="field-section"><b>Collect Music</b><p class="sub">A collection date can be scheduled from a daily rehearsal plan or from here.</p><form data-form="collection" class="stack"><input type="date" name="date" value="${esc(ui.date)}" required><select name="piece">${db.pieces.filter(p=>!p.archived).map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select><select name="ensemble"><option value="6">6th Grade</option><option value="78">7th/8th Grade</option></select><button>+ Schedule Collection</button></form></div><div class="field-section"><h3>Storage & Backups</h3><p class="small">Changes autosave in this browser. Devices do not yet synchronize.</p><div class="stack"><button data-action="backup">↓ Download Backup (.json)</button><label>Restore Backup (.json)<input type="file" id="restore-file" accept=".json,application/json"></label></div></div></div></div>`}
function bind(){document.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{ui.view=el.dataset.nav;rerender()});document.querySelectorAll('[data-repertoire-filter]').forEach(el=>el.onclick=()=>{ui.repertoireFilter=el.dataset.repertoireFilter;rerender()});document.querySelectorAll('[data-ensemble]').forEach(el=>el.onclick=()=>{ui.ensemble=el.dataset.ensemble;rerender()});document.querySelector('#global-date')?.addEventListener('change',e=>{ui.date=e.target.value;rerender()});document.querySelectorAll('[data-open-piece]').forEach(el=>el.onclick=()=>{ui.piece=el.dataset.openPiece;ui.view='map';const p=getPiece(ui.piece);p?.marks.forEach(m=>ui.expanded[m.id]=true);rerender()});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>action(el.dataset.action));document.querySelectorAll('[data-toggle-mark]').forEach(el=>el.onclick=()=>{const k=el.dataset.toggleMark;ui.expanded[k]=!ui.expanded[k];rerender()});document.querySelectorAll('[data-status]').forEach(el=>el.onchange=()=>{findMark(el.dataset.status).status=el.value;update()});document.querySelectorAll('[data-mark-plan]').forEach(el=>el.onchange=()=>{const mid=el.dataset.markPlan;let a=plan();const existing=a.find(x=>x.kind==='mark'&&x.piece===ui.piece&&x.mark===mid);if(existing)a=a.filter(x=>x!==existing);else a.push({id:uid(),kind:'mark',piece:ui.piece,mark:mid});setPlan(a)});document.querySelectorAll('[data-note-done]').forEach(el=>el.onchange=()=>{const [m,n]=el.dataset.noteDone.split('|');findMark(m).notes.find(x=>x.id===n).done=el.checked;update()});document.querySelectorAll('[data-note-edit]').forEach(el=>{el.addEventListener('blur',()=>{const [m,n]=el.dataset.noteEdit.split('|'),obj=findMark(m).notes.find(x=>x.id===n);if(obj.text!==el.innerText.trim()){obj.text=el.innerText.trim();save()}});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}})});document.querySelectorAll('[data-delete-note]').forEach(el=>el.onclick=()=>{const [m,n]=el.dataset.deleteNote.split('|');findMark(m).notes=findMark(m).notes.filter(x=>x.id!==n);update()});document.querySelectorAll('[data-skill-toggle]').forEach(el=>el.onclick=()=>{ui.skillOpen[el.dataset.skillToggle]=!ui.skillOpen[el.dataset.skillToggle];rerender()});document.querySelectorAll('[data-skill],[data-skill-remove]').forEach(el=>el.onclick=()=>{const [id,...rest]=(el.dataset.skill||el.dataset.skillRemove).split('|'),s=rest.join('|'),m=findMark(id);m.skills=m.skills.includes(s)?m.skills.filter(x=>x!==s):[...m.skills,s];update()});document.querySelectorAll('[data-remove-mark]').forEach(el=>el.onclick=()=>{if(!confirm('Delete this rehearsal mark and its notes?'))return;const p=getPiece(ui.piece);p.marks=p.marks.filter(x=>x.id!==el.dataset.removeMark);update()});document.querySelectorAll('form[data-form]').forEach(el=>el.onsubmit=e=>{e.preventDefault();submit(el)});document.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{ui.date=el.dataset.day;rerender()});document.querySelectorAll('[data-off-toggle]').forEach(el=>el.onclick=e=>{e.stopPropagation();const d=el.dataset.offToggle;if(db.offDays[d])delete db.offDays[d];else db.offDays[d]=true;update()});document.querySelectorAll('[data-month]').forEach(el=>el.onclick=()=>{const [y,m]=ui.month.split('-').map(Number),d=new Date(y,m-1+Number(el.dataset.month),1);ui.month=dateStr(d).slice(0,7);rerender()});document.querySelector('#off-day')?.addEventListener('change',e=>{if(e.target.checked)db.offDays[ui.date]=true;else delete db.offDays[ui.date];update()});document.querySelectorAll('[data-delete-collection]').forEach(el=>el.onclick=()=>{db.collections=db.collections.filter(c=>c.id!==el.dataset.deleteCollection);update()});document.querySelectorAll('[data-delete-school-date]').forEach(el=>el.onclick=()=>{delete db.offDays[el.dataset.deleteSchoolDate];delete db.alteredDays[el.dataset.deleteSchoolDate];update()});document.querySelectorAll('[data-delete-concert]').forEach(el=>el.onclick=()=>{db.concerts=db.concerts.filter(x=>x.id!==el.dataset.deleteConcert);update()});document.querySelectorAll('[data-add-recording]').forEach(el=>el.onclick=()=>{const p=getPiece(el.dataset.addRecording),url=p.recording||prompt('Enter recording URL (https://...)');if(url&&/^https:\/\//i.test(url)){const a=plan();a.push({id:uid(),kind:'recording',piece:p.id,url});setPlan(a)}else if(!url)alert('Add a recording link in Piece Settings first, or paste a URL.')});document.querySelectorAll('[data-add-collection]').forEach(el=>el.onclick=()=>{db.collections.push({id:uid(),piece:el.dataset.addCollection,date:ui.date,ensemble:ui.ensemble});update()});document.querySelectorAll('[data-add-run]').forEach(el=>el.onclick=()=>addItem('run',el.dataset.addRun));document.querySelectorAll('[data-add-plan-mark]').forEach(el=>el.onclick=()=>addItem('mark',...el.dataset.addPlanMark.split('|')));document.querySelectorAll('[data-remove-item]').forEach(el=>el.onclick=()=>setPlan(plan().filter(x=>x.id!==el.dataset.removeItem)));document.querySelectorAll('[data-move]').forEach(el=>el.onclick=()=>{const [id,delta]=el.dataset.move.split('|'),a=[...plan()],i=a.findIndex(x=>x.id===id),j=i+Number(delta);if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];setPlan(a)}});document.querySelectorAll('[data-drag-item]').forEach(el=>{el.ondragstart=e=>{ui.drag=el.dataset.dragItem;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'};el.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};el.ondrop=e=>{e.preventDefault();let a=[...plan()],from=a.findIndex(x=>x.id===ui.drag),to=a.findIndex(x=>x.id===el.dataset.dragItem);if(from>=0&&to>=0&&from!==to){const [it]=a.splice(from,1);a.splice(to,0,it);setPlan(a)}};el.ondragend=()=>el.classList.remove('dragging')});document.querySelector('#edit-select')?.addEventListener('change',e=>{ui.piece=e.target.value;rerender()});document.querySelector('#restore-file')?.addEventListener('change',restoreFile)}
function findMark(id){return getPiece(ui.piece).marks.find(m=>m.id===id)}
function submit(form){const fd=new FormData(form),kind=form.dataset.form;if(kind==='note'){findMark(form.dataset.markId).notes.push({id:uid(),text:String(fd.get('note')).trim(),done:false})}else if(kind==='mark'){getPiece(ui.piece).marks.push({id:uid(),name:String(fd.get('name')).trim(),status:'Needs Teaching',notes:[],skills:[]})}else if(kind==='announcement'){const it=plan().find(x=>x.id===form.dataset.id);it.notes.push(String(fd.get('note')).trim())}else if(kind==='school-date'){const d=String(fd.get('date'));if(fd.get('type')==='off'){db.offDays[d]=true;delete db.alteredDays[d]}else{db.alteredDays[d]=String(fd.get('label')||'Altered Schedule');delete db.offDays[d]}}else if(kind==='collection'){db.collections.push({id:uid(),date:String(fd.get('date')),piece:String(fd.get('piece')),ensemble:String(fd.get('ensemble'))})}else if(kind==='concert'){db.concerts.push({id:uid(),name:String(fd.get('name')).trim(),ensemble:fd.get('ensemble'),date:String(fd.get('date')||ui.date)})}else if(kind==='edit-piece'){const p=getPiece(ui.piece);for(const k of ['title','composer','ensemble','color','score','recording','cover','publisher'])p[k]=String(fd.get(k)||'').trim();p.prep=[0,1,2].map(i=>fd.has('prep'+i));p.archived=fd.has('archived');ui.view='repertoire'}update()}
function action(k){const p=getPiece(ui.piece);if(k==='new-piece'){const id=uid();db.pieces.push({id,title:'Untitled Piece',composer:'',ensemble:ui.ensemble,color:'#538a78',cover:'',score:'',recording:'',publisher:'',archived:false,prep:[false,false,false],marks:[]});ui.piece=id;ui.view='settings';update()}else if(k==='pepper-search'){window.open('https://www.jwpepper.com/sheet-music/search.jsp?keywords='+encodeURIComponent(p.title),'_blank','noopener,noreferrer')}else if(k==='toggle-archive'){ui.showArchive=!ui.showArchive;rerender()}else if(k==='edit-piece'){ui.view='settings';rerender()}else if(k==='toggle-all'){const all=p.marks.every(m=>ui.expanded[m.id]);p.marks.forEach(m=>ui.expanded[m.id]=!all);rerender()}else if(k==='score-link'||k==='recording-link'){const link=k==='score-link'?p.score:p.recording;if(/^https:\/\//i.test(link))window.open(link,'_blank','noopener,noreferrer')}else if(k==='add-run'){addItem('run',p.id)}else if(k==='add-recording-plan'){const url=prompt('Recording URL (https://...)');if(url&&/^https:\/\//i.test(url)){plan().push({id:uid(),kind:'recording',piece:p.id,url});update()}}else if(k==='add-collection'){if(!p)return;db.collections.push({id:uid(),date:ui.date,piece:p.id,ensemble:ui.ensemble});update()}else if(k==='add-announcement'){addItem('announcement')}else if(k==='copy-canva'){const html=exportHTML(plan()),plain=blocks(plan()).map(b=>b.title+'\n'+b.notes.map(x=>'• '+x).join('\n')).join('\n\n');(async()=>{try{if(navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);alert('Formatted rehearsal plan copied. Paste into Canva.')}else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(plain);alert('Rehearsal text copied. Apply bold to headings in Canva.')}else prompt('Copy your rehearsal plan:',plain)}catch{prompt('Copy your rehearsal plan:',plain)}})()}else if(k==='backup'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='band-rehearsal-backup-'+today+'.json';a.click();URL.revokeObjectURL(url)}else if(k==='delete-piece'){if(!confirm('Permanently delete this piece and its notes?'))return;db.pieces=db.pieces.filter(x=>x.id!==ui.piece);ui.piece=db.pieces[0]?.id;ui.view='repertoire';update()}}
async function restoreFile(e){const file=e.target.files[0];if(!file)return;try{const next=JSON.parse(await file.text());if(!Array.isArray(next.pieces)||typeof next.plans!=='object'||!Array.isArray(next.concerts))throw Error('Invalid backup');if(!confirm('Replace all current repertoire and plans with this backup?'))return;db=next;ui.view='repertoire';ui.piece=db.pieces[0]?.id;update()}catch(err){alert('Could not restore: '+err.message)}}rerender();
</script></body></html>
