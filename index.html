function renderRepertoire(){const pieces=db.pieces.filter(p=>!p.archived&&(ui.repertoireFilter==='all'||p.ensemble===ui.repertoireFilter||p.ensemble==='both')&&(ui.categoryFilter==='all'||(p.categories||[]).includes(ui.categoryFilter)||(ui.categoryFilter==='concert'&&!!p.concertId)));return `<div class="pane"><div class="row spread"><h2 class="heading">My Repertoire</h2><div class="row"><button data-action="new-piece" class="primary">+ Add Piece</button></div></div><div class="repertoire-filter"><span class="section-label">Show Scores</span>${[['all','All Scores'],['6','6th Grade'],['78','7th/8th Grade']].map(([k,v])=>`<button data-repertoire-filter="${k}" class="${ui.repertoireFilter===k?'primary':''}">${v}</button>`).join('')}</div><div class="repertoire-filter" style="margin-top:9px"><span class="section-label">Music Type</span>${[['all','All'],['concert','Concert Dates'],...db.categories.map(x=>[x,x])].map(([k,v])=>`<button data-category-filter="${k}" class="${ui.categoryFilter===k?'primary':''}">${v}</button>`).join('')}</div><div class="cards" style="margin-top:14px">${pieces.map(p=>`<div class="card music-card" data-open-piece="${p.id}"><div class="cover">${cover(p)}</div><h3>${esc(p.title)}</h3><div class="meta">${esc(p.composer||'Composer not added')}</div><div class="row spread"><span class="ensemble-chip">${p.ensemble==='both'?'Both bands':p.ensemble==='6'?'6th Grade':'7th/8th Grade'}</span><span class="color-dot" style="background:${esc(p.color)}"></span></div><div class="row spread small" style="margin-top:10px"><span>Musical mastery</span><b>${mastery(p)}%</b></div><div class="meter"><span style="background:${esc(p.color)};width:${mastery(p)}%"></span></div><div class="row spread" style="margin-top:8px"><span class="meta">${p.marks.length} sections</span><span class="meta">Open →</span></div></div>`).join('')||'<p>No pieces found for this filter.</p>'}</div></div>${ui.showArchive?`<div class="pane"><h3>Repertoire Archive</h3><div class="cards">${db.pieces.filter(p=>p.archived).map(p=>`<button data-open-piece="${p.id}">${esc(p.title)}</button>`).join('')||'No archived pieces'}</div></div>`:''}`}
function markSymbol(name){const main=String(name).split('-')[0].trim();if(/d\.?s\.?|dal segno/i.test(main))return '𝄋';if(/coda/i.test(main))return '𝄌';const m=main.match(/\d+/);return m?m[0]:main.toLowerCase().includes('opening')?'O':main.slice(0,2)}
function markSuffix(name){const i=String(name).indexOf('-');return i>=0?String(name).slice(i+1).trim():''}
function renderMap(){let p=getPiece(ui.piece)||db.pieces[0];if(!p)return '<div class="pane">Add a piece to begin.</div>';const current=plan();return `<div class="row spread"><div><h2 style="margin:0">${esc(p.title)}</h2><div class="sub">${esc(p.composer||'Composer not added')} · ${p.ensemble==='both'?'Both ensembles':p.ensemble==='6'?'6th Grade':'7th/8th Grade'}</div></div><div class="controls"><button ${p.score?'':'disabled'} title="Open Score PDF" aria-label="Open Score PDF" data-action="score-link">📕</button><button ${p.recording?'':'disabled'} title="Open Recording" aria-label="Open Recording" data-action="recording-link">📼</button><button data-action="edit-piece" title="Piece Setup" aria-label="Piece Setup">⚙</button><button data-nav="repertoire">←</button></div></div><div class="pane"><div class="chips compact-tags">${db.categories.map(c=>`<button class="${(p.categories||[]).includes(c)?'active':''}" data-piece-category="${esc(c)}">${esc(c)}</button>`).join('')}</div></div><div class="pane"><div class="row spread"><h3 class="heading">Rehearsal Map</h3><button data-action="toggle-all">${p.marks.every(m=>ui.expanded[m.id])?'Collapse':'Expand'} All</button></div>${p.marks.map(m=>{const scheduled=current.some(i=>i.kind==='mark'&&i.piece===p.id&&i.mark===m.id);return `<section class="measure"><div class="measure-head"><strong><button class="minimal measure-title" data-toggle-mark="${m.id}"><span class="measure-symbol">${markSymbol(m.name)}</span><span>${esc(markSuffix(m.name))}</span></button></strong><select class="status-pill status-select" data-status="${m.id}" data-kind="${esc(m.status)}" aria-label="Learning status for ${esc(m.name)}">${statuses.map(st=>`<option value="${esc(st)}" ${st===m.status?'selected':''}>${esc(st)}</option>`).join('')}</select></div>${ui.expanded[m.id]?`<div class="measure-body"><div class="row" style="margin-bottom:8px"></div>${m.notes.map(n=>`<div class="note ${n.done?'done':''}"><input type="checkbox" data-note-done="${m.id}|${n.id}" function renderCalendar(){const [yy,mm]=ui.month.split('-').map(Number);const first=new Date(yy,mm-1,1).getDay(),num=new Date(yy,mm,0).getDate(),rows=Math.ceil((first+num)/7);let cells='';for(let w=0;w<rows;w++){cells+='<div class="week">';for(let c=0;c<7;c++){const n=w*7+c-first+1;if(n<1||n>num){cells+='<div></div>';continue}const d=ui.month+'-'+String(n).padStart(2,'0'),events=db.concerts.filter(x=>x.date===d&&(x.ensemble===ui.ensemble||x.ensemble==='both')),collect=db.collections.filter(x=>x.date===d&&(x.ensemble===ui.ensemble||x.ensemble==='both')),labels=db.pieces.filter(p=>(p.ensemble===ui.ensemble||p.ensemble==='both')&&pieceInDay(d,p.id,ui.ensemble)),altered=db.alteredDays[d];cells+=`<div class="day ${c===0||c===6?'weekend':''} ${db.offDays[d]?'off':''} ${altered?'altered-day':''} ${events.length?'concert-day':''} ${ui.date===d?'selected':''}" data-day="${d}"><span class="date-num">${n}</span>${db.offDays[d]?'<div class="sub">No school</div>':''}${altered?`<div class="event" style="background:#287f9a">${esc(altered)}</div>`:''}${events.map(e=>`<div class="event concert">♫ ${esc(e.name)} · ${e.ensemble==='6'?'6th':e.ensemble==='78'?'7/8':'Both'}</div>`).join('')}${collect.map(e=>`<div class="event collection-event">↩ Collect: ${esc(getPiece(e.piece)?.title||'Music')}</div>`).join('')}${labels.map(p=>`<div class="event" style="background:${esc(p.color)}">${esc(p.title)}</div>`).join('')}</div>`}cells+='</div>'}return `<div class="pane"><div class="row spread"><button data-month="-1">← Previous</button><h2 class="heading">${new Date(yy,mm-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><button data-month="1">Next →</button></div><div class="calendar-wrap"><div class="calendar"><div class="week">${['Sun','Monday','Tuesday','Wednesday','Thursday','Friday','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}</div>${cells}</div></div><div class="row calendar-footer"><span class="sub">Gray = No School/weekend · Blue = altered schedule · Purple = concerts · Brown = collect music</span><div class="row"><button class="minimal" data-action="quick-collection">+ Collection</button><button class="minimal" data-action="quick-concert">+ Concert</button></div></div></div>${renderPlan()}`}
function renderPlan(){const items=plan();const eligible=db.pieces.filter(p=>!p.archived&&applicable(p));return `<div class="row spread"><div><h2 class="daily-date">${new Date(ui.date+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</h2><div class="sub">${ui.ensemble==='6'?'6th':'7th/8th'} Grade Rehearsal</div></div></div><div class="split" style="margin-top:14px"><div class="pane"><div class="row spread"><h3 class="heading">Rehearsal Order</h3><span class="sub">Drag ≡ to reorder</span></div>${items.map((it,i)=>{const p=getPiece(it.piece),m=p?.marks.find(x=>x.id===it.mark);const title=it.kind==='announcement'?'Announcements & Reminders':it.kind==='custom'?'My Notes':p?.title||'Piece';const lines=(it.kind==='announcement'||it.kind==='custom')?it.notes:it.kind==='run'?['Run Through']:it.kind==='recording'?['Recording: '+(it.url||p?.recording||'')]:it.kind==='mark'?m?.notes.filter(n=>!n.done&&!(it.excluded||[]).includes(n.id)).map(n=>'m'+(m.name.match(/[0-9]+/)||[''])[0]+' - '+n.text)||[]:[];return `<div class="builder-item" draggable="true" data-drag-item="${it.id}"><span class="grab" title="Drag to reorder">☰</span><div class="builder-content"><h4>${p?`<span class="color-dot" style="background:${p.color}"></span> `:''}${esc(title)} ${it.kind==='mark'?`<span class="status-pill">${esc(m?.name||'Measure')}</span>`:''}</h4>${it.kind==='mark'?`<div class="stack">${(m?.notes||[]).filter(n=>!n.done).map(n=>`<label><input type="checkbox" data-plan-note="${it.id}|${n.id}" ${!(it.excluded||[]).includes(n.id)?'checked':''}> m${(m.name.match(/[0-9]+/)||[''])[0]} - ${esc(n.text)}</label>`).join('')}</div>`:lines.length?`<ul>${lines.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}${(it.kind==='announcement'||it.kind==='custom')?`<form data-form="announcement" data-id="${it.id}" class="row"><input class="grow" name="note" placeholder="Add reminder (Enter)" required><button>+</button></form>`:''}</div><div class="stack"><button class="minimal" data-move="${it.id}|-1" ${i===0?'disabled':''}>↑</button><button class="minimal" data-move="${it.id}|1" ${i===items.length-1?'disabled':''}>↓</button><button class="minimal danger" data-remove-item="${it.id}">×</button></div></div>`}).join('')||'<p class="muted">Add pieces or announcements to start planning.</p>'}<div class="controls"><button data-action="add-announcement">+ Announcements</button><button data-action="add-own-text">+ My Own Text</button></div></div><div class="pane"><h3 class="heading">Add Rehearsal Material</h3>${eligible.map(p=>`<details style="border-bottom:1px solid var(--line);padding:10px 0"><summary><span class="color-dot" style="background:${p.color}"></span> <b>${esc(p.title)}</b></summary><div class="stack" style="padding:10px"><div class="small-mark-grid">${p.marks.map(m=>`<button data-add-plan-mark="${p.id}|${m.id}" title="${esc(m.name)}">${esc(markSymbol(m.name))}</button>`).join('')}</div><button data-open-piece="${p.id}">View full rehearsal map ↗</button><div class="controls"><button data-add-run="${p.id}">+ Run Through</button><button data-add-recording="${p.id}">+ Recording Link</button><button data-add-collection="${p.id}">+ Collect Music</button></div></div></details>`).join('')}<hr><h3>Canva Export</h3><button class="primary" style="width:100%;margin-top:12px" data-action="copy-canva">Copy formatted plan</button><div class="sub" style="margin-top:8px">Copies styled HTML with bold headings and bullets, plus plain text fallback. Paste into Canva.</div></div></div>`}
function blocks(items){let out=[];for(const it of items){const p=getPiece(it.piece),m=p?.marks.find(x=>x.id===it.mark);const title=it.kind==='announcement'?'Announcements and Reminders':it.kind==='custom'?'My Notes':p?.title||'Piece';const notes=(it.kind==='announcement'||it.kind==='custom')?it.notes:it.kind==='run'?['Run Through']:it.kind==='recording'?['Recording: '+(it.url||p?.recording||'')]:it.kind==='mark'?m?.notes.filter(n=>!n.done).map(n=>n.text)||[]:[];if(out.length&&out[out.length-1].title===title&&it.kind!=='announcement')out[out.length-1].notes.push(...notes);else out.push({title,notes:[...notes]})}return out}
function exportHTML(items){return blocks(items).map(b=>`<div><h3 style="font-weight:700;margin:12px 0 3px;font-size:18px">${esc(b.title)}</h3><ul style="margin:0 0 8px;padding-left:24px">${b.notes.map(n=>`<li style="list-style:none">- ${esc(n)}</li>`).join('')}</ul></div>`).join('')||'<span class="muted">Nothing planned yet.</span>'}
function percussionOf(p){if(!p.percussion)p.percussion={parts:[],playerOverride:null};return p.percussion}
function percussionEstimate(p){return percussionOf(p).parts.reduce((a,x)=>a+Math.max(1,Number(x.players)||1),0)}
function percussionTotal(p){const val=percussionOf(p).playerOverride;return val===null||val===undefined||val===''?percussionEstimate(p):Math.max(0,Number(val)||0)}
function percussionConflicts(p){const m=new Map;for(const r of percussionOf(p).parts)for(const n of (r.students||[])){const name=String(n||'').trim(),key=name.toLowerCase().replace(/\s+/g,' ');if(!key)continue;if(!m.has(key))m.set(key,{key,name,parts:[]});m.get(key).parts.push(r)}return [...m.values()]}
function renderPercussionConflicts(p){const pd=percussionOf(p);pd.approvedDoublings=pd.approvedDoublings||{};const people=percussionConflicts(p),conflicts=people.filter(x=>new Set(x.parts.map(r=>r.id)).size>1);return `<div class="pane"><h3>Student Availability & Conflicts</h3><p class="sub">Flags students listed on multiple parts in the same piece. Confirm intentional doubling when a student can cover both.</p><div>${people.map(x=>`<span class="perc-student">${esc(x.name)} · ${x.parts.length} assignment(s)</span>`).join('')||'<span class="sub">No student assignments yet.</span>'}</div>${conflicts.map(c=>{const key=c.key+'|'+[...new Set(c.parts.map(r=>r.id))].sort().join('|'),ok=!!pd.approvedDoublings[key];return `<div class="perc-conflict ${ok?'ok':''}"><b>${ok?'✓ Confirmed doubling':'⚠ Potential conflict'}: ${esc(c.name)}</b><p class="small">${c.parts.map(r=>esc(r.label)+' — '+esc(r.instruments)).join(' · ')}</p><label><input type="checkbox" data-perc-approved="${encodeURIComponent(key)}" ${ok?'checked':''}> Confirm student can cover these parts</label></div>`}).join('')}${conflicts.length===0?'<p style="color:#177457">✓ No overlapping assignments found.</p>':''}<p class="sub">Approval applies to this combination of parts; this check does not assess simultaneous notes in the score.</p></div>`}
function renderPercussion(){const p=getPiece(ui.piece)||db.pieces[0];if(!p)return '<div class="pane">Add a repertoire piece first.</div>';const data=percussionOf(p),rows=data.parts;return `<div class="pane"><div class="row spread"><div><h2 class="heading">Percussion Assignments</h2><p class="sub">Build each piece’s original part list, estimate players, then assign students. Changes autosave.</p></div><button data-action="percussion-print">Print Assignment Chart</button></div><div class="field" style="max-width:480px"><label>SELECT A PIECE</label><select id="perc-piece-select">${db.pieces.filter(x=>x.ensemble===ui.ensemble||x.ensemble==='both').map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></div><div class="row" style="margin-bottom:12px"><span class="ensemble-chip">${p.ensemble==='6'?'6th Grade':p.ensemble==='78'?'7th/8th Grade':'Both'}</span><b>${esc(p.title)}</b></div><div class="row"><span class="section-label">Estimated:</span> <b>${percussionEstimate(p)} players</b></div><p class="sub">Each part is one player. Assign a student to each part.</p><h3>Original Percussion Part Inventory</h3><div class="perc-source" style="font-weight:700;background:#eef3ef;padding:8px"><span>Part / Score Label</span><span>Instruments used</span><span>Assigned Students</span><span></span></div>${rows.map(r=>`<div class="perc-source" data-perc-row="${r.id}"><input data-perc-field="label" data-part-id="${r.id}" value="${esc(r.label)}" aria-label="Part name"><input data-perc-field="instruments" data-part-id="${r.id}" value="${esc(r.instruments||'')}" aria-label="Instruments on this part" placeholder="Optional instruments"><div class="stack">${Array.from({length:Math.min(24,Math.max(1,Number(r.players)||1))},(_,i)=>`<input data-perc-student="${r.id}|${i}" value="${esc((r.students||[])[i]||'')}" placeholder="Student ${i+1}" aria-label="Student ${i+1}">`).join('')}</div><button class="danger" data-perc-delete="${r.id}" title="Delete percussion part">×</button></div>`).join('')}<form data-form="percussion-add" class="row" style="margin:12px 0"><input name="label" placeholder="e.g. Percussion 2" required><input name="instruments" placeholder="Instruments (optional)"><button class="primary">+ Add Part</button></form><p class="sub">Original parts and instrument names remain saved even if student assignments change.</p><div class="row"><span class="${rows.some(r=>Array.from({length:r.players||1},(_,i)=>!(r.students||[])[i]?.trim()).some(Boolean))?'perc-warning':'perc-ok'}">${rows.reduce((n,r)=>n+Array.from({length:Math.max(1,Number(r.players)||1)},(_,i)=>!(r.students||[])[i]?.trim()).filter(Boolean).length,0)} open player slots</span><span class="sub">Assign each required slot. A student may appear on more than one part.</span></div></div>${renderPercussionConflicts(p)}<div class="pane"><div class="row spread"><h3 class="heading">Percussion Assignment Table</h3><span class="sub">Students on the left; each composition is a column with their assigned parts</span></div><div class="perc-controls"><button data-ensemble="6" class="${ui.ensemble==='6'?'primary':''}">6th Grade</button><button data-ensemble="78" class="${ui.ensemble==='78'?'primary':''}">7th/8th Grade</button></div><div id="percussion-matrix" class="perc-table-scroll">${percussionMatrix(ui.ensemble)}</div></div>`}
function percussionMatrix(filter){const ps=db.pieces.filter(p=>!p.archived&&(filter==='all'||p.ensemble===filter||p.ensemble==='both'));if(!ps.length)return '<p class="sub">No pieces available.</p>';const students=new Map;for(const p of ps)for(const part of percussionOf(p).parts)for(const name of part.students||[]){const key=String(name||'').trim().toLowerCase().replace(/\s+/g,' ');if(key&&!students.has(key))students.set(key,name.trim())}const ordered=[...students.entries()].sort((a,b)=>a[1].localeCompare(b[1]));return `<table class="perc-grid student-grid"><thead><tr><th>Student</th>${ps.map(p=>`<th>${esc(p.title)}</th>`).join('')}</tr></thead><tbody>${ordered.map(([key,name])=>`<tr><th class="student-cell">${esc(name)}</th>${ps.map(p=>{const parts=percussionOf(p).parts.filter(r=>(r.students||[]).some(n=>String(n||'').trim().toLowerCase().replace(/\s+/g,' ')===key));return `<td>${parts.map(r=>`<div class="student-part"><b>${esc(r.label)}</b>${r.instruments?`<div class="sub">${esc(r.instruments)}</div>`:''}</div>`).join('')||'<span class="sub">—</span>'}</td>`}).join('')}</tr>`).join('')}${ordered.length?'':'<tr><td colspan="'+(ps.length+1)+'">Enter student assignments above to generate the grid.</td></tr>'}</tbody></table>`}
function percussionFromText(line){const at=line.indexOf(' - ');if(at<0)return {label:line.trim(),instruments:''};return {label:line.slice(0,at).trim(),instruments:line.slice(at+3).trim()}}
function applyPieceSetup(form){const p=getPiece(ui.piece);if(!p)return false;const fd=new FormData(form);
for(const k of ['title','composer','score','recording','cover','publisher'])p[k]=String(fd.get(k)||'').trim();
p.ensemble=form.querySelector('[data-group="ensemble"] .selected')?.dataset.value||p.ensemble;
p.concertIds=[...form.querySelectorAll('[data-group="concert"] .selected')].map(x=>x.dataset.value);
p.concertId=p.concertIds[0]||'';
p.categories=[...form.querySelectorAll('[data-group="category"] .selected')].map(x=>x.dataset.value);
p.color=String(fd.get('color')||p.color);
p.prep=[0,1,2].map(i=>fd.has('prep'+i));p.archived=fd.has('archived');
const markNames=String(fd.get('marks')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),used=new Set,marks=[];
for(const name of markNames){const existing=p.marks.find(m=>!used.has(m.id)&&m.name===name)||p.marks.find(m=>!used.has(m.id)&&markSymbol(m.name)===markSymbol(name));if(existing){used.add(existing.id);existing.name=name;marks.push(existing)}else marks.push({id:uid(),name,status:'Needs Teaching',notes:[],skills:[]})}
if(p.marks.some(m=>!used.has(m.id))&&!confirm('Some rehearsal marks were removed. Delete their notes as well?'))return false;
p.marks=marks;
const perc=percussionOf(p),lines=String(fd.get('percussion')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),taken=new Set,next=[];
for(const line of lines){const {label,instruments}=percussionFromText(line);const existing=perc.parts.find(r=>!taken.has(r.id)&&r.label===label&&r.instruments===instruments)||perc.parts.find(r=>!taken.has(r.id)&&r.label===label);if(existing){taken.add(existing.id);existing.label=label;existing.instruments=instruments;next.push(existing)}else next.push({id:uid(),label,instruments,players:1,students:[]})}

function findMark(id){return getPiece(ui.piece).marks.find(m=>m.id===id)}
function submit(form){const fd=new FormData(form),kind=form.dataset.form;if(kind==='category'){const name=String(fd.get('name')||'').trim();if(name&&!db.categories.includes(name))db.categories.push(name)}else if(kind==='note'){findMark(form.dataset.markId).notes.push({id:uid(),text:String(fd.get('note')).trim(),done:false})}else if(kind==='mark'){getPiece(ui.piece).marks.push({id:uid(),name:String(fd.get('name')).trim(),status:'Needs Teaching',notes:[],skills:[]})}else if(kind==='announcement'){const it=plan().find(x=>x.id===form.dataset.id);it.notes.push(String(fd.get('note')).trim())}else if(kind==='percussion-add'){const p=getPiece(ui.piece),pd=percussionOf(p);pd.parts.push({id:uid(),label:String(fd.get('label')).trim(),instruments:String(fd.get('instruments')||'').trim(),players:1,students:[]})}else if(kind==='school-date'){const d=String(fd.get('date'));if(fd.get('type')==='off'){db.offDays[d]=true;delete db.alteredDays[d]}else{db.alteredDays[d]=String(fd.get('label')||'Altered Schedule');delete db.offDays[d]}}else if(kind==='collection'){db.collections.push({id:uid(),date:String(fd.get('date')),piece:String(fd.get('piece')),ensemble:String(fd.get('ensemble'))})}else if(kind==='concert'){db.concerts.push({id:uid(),name:String(fd.get('name')).trim(),ensemble:fd.get('ensemble'),date:String(fd.get('date')||ui.date)})}else if(kind==='edit-piece'){if(!applyPieceSetup(form))return;ui.view='map'}update()}
function action(k){const p=getPiece(ui.piece);if(k==='new-piece'){const id=uid();db.pieces.push({id,title:'Untitled Piece',composer:'',ensemble:ui.ensemble,color:'#538a78',cover:'',score:'',recording:'',publisher:'',archived:false,prep:[false,false,false],marks:[]});ui.piece=id;ui.view='settings';update()}else if(k==='pepper-search'||k==='google-search'){const title=document.querySelector('#piece-title-input')?.value?.trim()||p.title,composer=document.querySelector('#piece-composer-input')?.value?.trim()||p.composer,term=[title,composer].filter(Boolean).join(' by ');window.open(k==='pepper-search'?'https://www.google.com/search?q='+encodeURIComponent('site:jwpepper.com '+term):'https://www.google.com/search?q='+encodeURIComponent(term),'_blank','noopener,noreferrer')}else if(k==='save-bulk-marks'){const names=(document.querySelector('#bulk-marks')?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),existing=p.marks,next=[],used=new Set;for(const name of names){let found=existing.find(m=>!used.has(m.id)&&m.name.toLowerCase()===name.toLowerCase());if(found){used.add(found.id);next.push(found)}else{found=existing.find(m=>!used.has(m.id)&&markSymbol(m.name)===markSymbol(name));if(found){used.add(found.id);found.name=name;next.push(found)}else next.push({id:uid(),name,status:'Needs Teaching',notes:[],skills:[]})}}if(existing.some(m=>!used.has(m.id))&&!confirm('Some existing marks were removed. Delete those marks and their notes?'))return;p.marks=next;update()}else if(k==='save-bulk-percussion'){const names=(document.querySelector('#bulk-percussion')?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),pd=percussionOf(p),used=new Set,next=[];for(const label of names){const found=pd.parts.find(r=>!used.has(r.id)&&r.label.toLowerCase()===label.toLowerCase());if(found){used.add(found.id);next.push(found)}else next.push({id:uid(),label,instruments:'',players:1,students:[]})}if(pd.parts.some(r=>!used.has(r.id))&&!confirm('Delete removed percussion parts and their student assignments?'))return;pd.parts=next;update()}else if(k==='percussion-reset-total'){percussionOf(p).playerOverride=null;update()}else if(k==='percussion-print'){document.body.classList.add('print-percussion');window.print();setTimeout(()=>document.body.classList.remove('print-percussion'),500)}else if(k==='toggle-archive'){ui.showArchive=!ui.showArchive;rerender()}else if(k==='edit-piece'){ui.view='settings';rerender()}else if(k==='toggle-all'){const all=p.marks.every(m=>ui.expanded[m.id]);p.marks.forEach(m=>ui.expanded[m.id]=!all);rerender()}else if(k==='score-link'||k==='recording-link'){const link=k==='score-link'?p.score:p.recording;if(/^https:\/\//i.test(link))window.open(link,'_blank','noopener,noreferrer')}else if(k==='add-run'){addItem('run',p.id)}else if(k==='add-recording-plan'){const url=prompt('Recording URL (https://...)');if(url&&/^https:\/\//i.test(url)){plan().push({id:uid(),kind:'recording',piece:p.id,url});update()}}else if(k==='add-collection'){if(!p)return;db.collections.push({id:uid(),date:ui.date,piece:p.id,ensemble:ui.ensemble});update()}else if(k==='add-own-text'){addItem('custom')}else if(k==='quick-collection'){const id=prompt('Piece title to collect:');const p=db.pieces.find(x=>x.title.toLowerCase()===String(id||'').toLowerCase());if(p){db.collections.push({id:uid(),date:ui.date,piece:p.id,ensemble:ui.ensemble});update()}else if(id)alert('Select an exact piece title from Repertoire')}else if(k==='quick-concert'){ui.adminSection='school';ui.view='admin';rerender()}else if(k==='add-announcement'){addItem('announcement')}else if(k==='copy-canva'){const html=exportHTML(plan()),plain=blocks(plan()).map(b=>b.title+'\n'+b.notes.map(x=>'- '+x).join('\n')).join('\n\n');(async()=>{try{if(navigator.clipboard?.write&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);alert('Formatted rehearsal plan copied. Paste into Canva.')}else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(plain);alert('Rehearsal text copied. Apply bold to headings in Canva.')}else prompt('Copy your rehearsal plan:',plain)}catch{prompt('Copy your rehearsal plan:',plain)}})()}else if(k==='backup'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='band-rehearsal-backup-'+today+'.json';a.click();URL.revokeObjectURL(url)}else if(k==='delete-piece'){if(!confirm('Permanently delete this piece and its notes?'))return;db.pieces=db.pieces.filter(x=>x.id!==ui.piece);ui.piece=db.pieces[0]?.id;ui.view='repertoire';update()}}
async function restoreFile(e){const file=e.target.files[0];if(!file)return;try{const next=JSON.parse(await file.text());if(!Array.isArray(next.pieces)||typeof next.plans!=='object'||!Array.isArray(next.concerts))throw Error('Invalid backup');if(!confirm('Replace all current repertoire and plans with this backup?'))return;db=next;db.collections=db.collections||[];db.alteredDays=db.alteredDays||{};db.categories=db.categories||['Concert Music','Fun Music','Warm-Ups','Sight Reading','Other'];db.pieces.forEach(p=>{if(!Array.isArray(p.categories))p.categories=[p.category||'Concert Music']});ui.view='repertoire';ui.piece=db.pieces[0]?.id;update()}catch(err){alert('Could not restore: '+err.message)}}rerender();
</script></body></html>
